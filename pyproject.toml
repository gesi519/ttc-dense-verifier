[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttc-dense-verifier"
version = "0.1.0"
description = "Test-time compute dense verifier workflow scaffold for rigorous technical generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ttc-verifier = "ttc_dense_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

model_name_or_path: Qwen2.5-32B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
quantization_bit: 4

dataset: ttc_sft
dataset_dir: data/training/sft
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
val_size: 0.1

output_dir: checkpoints/generator_qwen32b_sft_lora
overwrite_output_dir: true
logging_dir: outputs/logs/generator_sft_tensorboard
logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 3

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
plot_loss: true
deepspeed: configs/training/deepspeed_zero3.json
